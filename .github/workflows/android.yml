name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: chmod +x android/gradlew
      # Set a repository variable API_URL (Settings -> Secrets and variables -> Actions -> Variables)
      # to your Render address. It is baked in as the app's default server.
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://autocare-api.onrender.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: autocare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
