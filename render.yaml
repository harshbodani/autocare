# Render Blueprint: creates the API (Node). The PostgreSQL database is hosted on Neon (free);
# paste its connection string as DATABASE_URL when Render asks for it.
services:
  - type: web
    name: autocare-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
